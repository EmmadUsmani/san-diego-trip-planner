<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile — Places</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F6F3}
a{color:#2C6E91}
button{font-family:Figtree,system-ui,sans-serif;cursor:pointer}
</style>
</helmet>
<div style="min-height: 700px; display: flex; flex-direction: column; font-family: Figtree, system-ui, sans-serif; color: #1F2328; font-variant-numeric: tabular-nums; background: #F7F6F3; width: 390px; box-sizing: border-box">
  <main style="flex: 1; padding: 24px 20px 32px; display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; letter-spacing: -0.03em; font-size: 32px; line-height: 1">Places</h1>
    <div role="group" aria-label="Show" style="display: grid; grid-template-columns: repeat(4, auto); gap: 4px; background: #EFEDE9; border-radius: 999px; padding: 4px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
        <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="{{t.style}}">{{t.name}}</button>
      </sc-for>
    </div>
    <div style="background: #FFFFFF; border-radius: 24px; padding: 4px 20px; display: flex; flex-direction: column">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div style="{{r.style}}">
          <span style="{{r.dot}}"></span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-weight: 600; font-size: 17px; line-height: 1.25">{{r.name}}</span>
            <span style="font-size: 14px; color: #5F656D; line-height: 1.3">{{r.sub}}</span>
          </div>
          <sc-if value="{{r.canAdd}}" hint-placeholder-val="{{ true }}">
            <button type="button" aria-label="Add to schedule" style="flex: none; width: 44px; height: 44px; border-radius: 999px; border: 0; background: #1F2328; color: #FFFFFF; display: grid; place-items: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
          </sc-if>
          <sc-if value="{{r.hasDay}}" hint-placeholder-val="{{ false }}">
            <span style="flex: none; min-width: 44px; text-align: center; font-size: 14px; font-weight: 600; background: #EFEDE9; border-radius: 999px; padding: 6px 12px">{{r.day}}</span>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </main>
<nav aria-label="Main" style="display: flex; background: #FFFFFF; border-top: 1px solid #ECEAE6; padding: 8px 12px 20px; box-sizing: border-box">
  <a href="#" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5F656D; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"></path></svg><span>Today</span></a>
  <a href="#" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5F656D; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg><span>Schedule</span></a>
  <a href="#" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5F656D; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.3"></circle></svg><span>Map</span></a>
  <a href="#" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #1F2328; font-size: 12px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"></path></svg><span>Places</span></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":873}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'sched' }; }
  renderVals() {
    const G = '#2FA67C', O = '#F0875A', Y = '#E8B923', Bl = '#4C8DEB';
    const L = {
      sched: [
        ['Sugar and Scribe', 'La Jolla', O, 'Sat'], ['Sea Cliff Trail', 'Del Mar', G, 'Sat'], ['Zoya', 'La Jolla', O, 'Sat'],
        ['Birch Aquarium', '2300 Expedition Way', G, 'Sun'], ['Harbor Tour', '990 N Harbor Dr', Y, 'Sun'], ['Aladdin Cafe', '3 mi from Airbnb', O, 'Sun'], ['San Diego Zoo', 'Balboa Park', G, 'Mon']
      ],
      ideas: [
        ['Rose Canyon Open Space', 'Hike · 8 min from Airbnb', G], ['Coast Walk Trail', 'La Jolla Cove, tide pools', G], ['Scripps Coastal Meander', 'Near Birch', G],
        ['MCA San Diego', 'La Jolla', G], ['UCSD Geisel Library', 'La Jolla', G], ['Kingdom of Padel', 'Pickleball', G], ['Little Italy', 'Pizza and gelato', G], ['Devil’s Dozen Donuts', 'Little Italy', G]
      ],
      food: [
        ['Akhi’s Shawarma and Kebab', '747 Turquoise St · halal', O], ['Urban Skillet', '9254 Scranton Rd · halal · 8 mi', O], ['Khyber Pass Zarparan', 'University Ave · halal unconfirmed', O],
        ['George’s at the Cove', 'La Jolla', O], ['Urbane Cafe', 'La Jolla · banh mi', O]
      ],
      charge: [
        ['Liberty Park Plaza', '4340 Genesee Ave · ~1.5 mi · 8 stalls', Bl], ['Villa La Jolla', '8657 Villa La Jolla Dr · 5 mi', Bl], ['Independence Square', '7373 Clairemont Mesa Blvd', Bl],
        ['Kearny Office Park', '8344 Clairemont Mesa Blvd', Bl], ['Fashion Valley', '7007 Friars Rd · 48 stalls', Bl], ['Morena Blvd', '845 Morena Blvd', Bl]
      ]
    };
    const T = [['sched', 'Scheduled'], ['ideas', 'Ideas'], ['food', 'Food'], ['charge', 'Chargers']];
    const cur = this.state.tab;
    const items = L[cur];
    return {
      tabs: T.map((x) => {
        const on = x[0] === cur;
        return { name: x[1], pressed: on ? 'true' : 'false', pick: () => this.setState({ tab: x[0] }),
          style: 'font: inherit; border: 0; border-radius: 999px; min-height: 44px; padding: 0 10px; font-size: 14px; white-space: nowrap; ' + (on ? 'background: #1F2328; color: #FFFFFF; font-weight: 600' : 'background: transparent; color: #1F2328; font-weight: 500') };
      }),
      rows: items.map((it, i) => ({
        name: it[0], sub: it[1], day: it[3] || '', hasDay: !!it[3], canAdd: !it[3],
        dot: 'flex: none; width: 10px; height: 10px; border-radius: 999px; background: ' + it[2],
        style: 'display: flex; align-items: center; gap: 14px; min-height: 76px; box-sizing: border-box; ' + (i ? 'border-top: 1px solid #ECEAE6' : '')
      }))
    };
  }
}
</script>
</body>
</html>
