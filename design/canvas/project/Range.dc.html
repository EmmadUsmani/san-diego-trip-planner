<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Range</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F6F3}
a{color:#2C6E91}a:hover{color:#1F5370}
input:focus-visible,button:focus-visible{outline:2px solid #2C6E91;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 1552px; background: #F7F6F3; font-family: Figtree, system-ui, sans-serif; color: #1F2328; font-variant-numeric: tabular-nums">

  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 40px; max-width: 1360px; margin: 0 auto; box-sizing: border-box">
    <a href="#" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1F2328">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="12" r="6" fill="#FFB547"></circle><path d="M3 19c3-2 5-2 8 0s5 2 8 0 5-2 6-1" fill="none" stroke="#2C6E91" stroke-width="2.2" stroke-linecap="round"></path><path d="M3 24c3-2 5-2 8 0s5 2 8 0 5-2 6-1" fill="none" stroke="#2C6E91" stroke-width="2.2" stroke-linecap="round" opacity=".45"></path></svg>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.02em">la jolla ’26</span>
    </a>
    <nav aria-label="Main" style="max-width: 100%; overflow-x: auto; box-sizing: border-box; display: flex; gap: 4px; background: #FFFFFF; border-radius: 999px; padding: 4px; box-shadow: 0 1px 2px rgba(31,35,40,.06)">
      <a href="#" style="padding: 8px 16px; border-radius: 999px; color: #1F2328; text-decoration: none; font-weight: 500; font-size: 14px">Overview</a>
      <a href="#" style="padding: 8px 16px; border-radius: 999px; color: #1F2328; text-decoration: none; font-weight: 500; font-size: 14px">Schedule</a>
      <a href="#" style="padding: 8px 16px; border-radius: 999px; color: #1F2328; text-decoration: none; font-weight: 500; font-size: 14px">Map</a>
      <a href="#" style="padding: 8px 16px; border-radius: 999px; color: #1F2328; text-decoration: none; font-weight: 500; font-size: 14px">Places</a>
      <a href="#" aria-current="page" style="padding: 8px 16px; border-radius: 999px; background: #1F2328; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 14px">Range</a>
    </nav>
    <div style="display: flex">
      <span title="Emmad" style="width: 32px; height: 32px; border-radius: 999px; background: #FFE3D3; color: #8A3A14; display: grid; place-items: center; font-weight: 700; font-size: 13px; border: 2px solid #F7F6F3">E</span>
      <span title="Ömer" style="width: 32px; height: 32px; border-radius: 999px; background: #D9F2EA; color: #1C6B50; display: grid; place-items: center; font-weight: 700; font-size: 13px; border: 2px solid #F7F6F3; margin-left: -8px">Ö</span>
    </div>
  </header>

  <main style="max-width: 1360px; margin: 0 auto; padding: 24px 40px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px">

    <section style="display: flex; flex-direction: column; gap: 12px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 48px; letter-spacing: -0.03em; line-height: 1.05">Range</h1>
      <p style="margin: 0; font-size: 17px; color: #5F656D; line-height: 1.5">2026 Model 3 Standard · 321 mi EPA</p>
    </section>

    <section style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="start-charge" style="font-size: 13px; font-weight: 500; color: #5F656D">Starting charge</label>
        <div style="display: flex; align-items: center; gap: 6px; height: 44px; box-sizing: border-box; padding: 0 16px; background: #FFFFFF; border: 1px solid #DCD9D3; border-radius: 12px">
          <input id="start-charge" type="text" inputmode="decimal" value="{{startStr}}" onInput="{{onStart}}" style="font: inherit; font-size: 16px; font-weight: 600; color: #1F2328; width: 48px; border: 0; background: transparent; padding: 0; outline-offset: 6px; text-align: right">
          <span style="font-size: 14px; color: #5F656D">%</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="efficiency" style="font-size: 13px; font-weight: 500; color: #5F656D">Efficiency</label>
        <div style="display: flex; align-items: center; gap: 6px; height: 44px; box-sizing: border-box; padding: 0 16px; background: #FFFFFF; border: 1px solid #DCD9D3; border-radius: 12px">
          <input id="efficiency" type="text" inputmode="decimal" value="{{effStr}}" onInput="{{onEff}}" style="font: inherit; font-size: 16px; font-weight: 600; color: #1F2328; width: 48px; border: 0; background: transparent; padding: 0; outline-offset: 6px; text-align: right">
          <span style="font-size: 14px; color: #5F656D">kWh/100 mi</span>
        </div>
      </div>
      <button type="button" aria-pressed="{{chargeOn}}" onClick="{{toggleCharge}}" style="{{chipStyle}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>
        <span>Include Monday charge</span>
      </button>
    </section>

    <section style="background: #FFFFFF; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap">
        <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em">Battery, Saturday to Tuesday</h2>
      </div>
      <div style="overflow-x: auto">
        <svg viewBox="0 0 1232 400" width="100%" role="img" aria-label="Battery percentage across the trip, Saturday to Tuesday" style="display: block; min-width: 760px; height: auto">
          <defs>
            <linearGradient id="lineGrad" gradientUnits="userSpaceOnUse" x1="0" y1="{{chart.gTop}}" x2="0" y2="{{chart.gBottom}}">
              <stop offset="0" stop-color="#2FA67C"></stop>
              <stop offset="{{chart.gOff}}" stop-color="#2FA67C"></stop>
              <stop offset="{{chart.gOff}}" stop-color="#C8432B"></stop>
              <stop offset="1" stop-color="#C8432B"></stop>
            </linearGradient>
          </defs>
          <rect x="{{chart.negX}}" y="{{chart.negY}}" width="{{chart.negW}}" height="{{chart.negH}}" fill="rgba(200,67,43,0.06)"></rect>
          <sc-for list="{{chart.grid}}" as="g" hint-placeholder-count="3">
            <g>
              <line x1="56" x2="1216" y1="{{g.y}}" y2="{{g.y}}" stroke="#ECEAE6" stroke-width="1"></line>
              <text x="44" y="{{g.ty}}" text-anchor="end" font-size="12" fill="#5F656D">{{g.label}}</text>
            </g>
          </sc-for>
          <sc-for list="{{chart.dividers}}" as="d" hint-placeholder-count="3">
            <line x1="{{d.x}}" x2="{{d.x}}" y1="44" y2="380" stroke="#ECEAE6" stroke-width="1"></line>
          </sc-for>
          <sc-for list="{{chart.days}}" as="d" hint-placeholder-count="4">
            <text x="{{d.x}}" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2328">{{d.label}}</text>
          </sc-for>
          <line x1="56" x2="1216" y1="{{chart.y20}}" y2="{{chart.y20}}" stroke="#C8432B" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6 6"></line>
          <text x="44" y="{{chart.y20t}}" text-anchor="end" font-size="12" font-weight="600" fill="#B93A24">20%</text>
          <path d="{{chart.d}}" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
          <sc-for list="{{chart.bolts}}" as="b" hint-placeholder-count="1">
            <g>
              <title>Monday charge</title>
              <circle cx="{{b.cx}}" cy="{{b.cy}}" r="13" fill="#DCEBFF"></circle>
              <path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#24518F" transform="{{b.t}}"></path>
            </g>
          </sc-for>
          <sc-for list="{{chart.dots}}" as="p" hint-placeholder-count="6">
            <g>
              <circle cx="{{p.x}}" cy="{{p.y}}" r="5.5" fill="#FFFFFF" stroke="{{p.color}}" stroke-width="3"></circle>
              <text x="{{p.lx}}" y="{{p.ly}}" text-anchor="{{p.anchor}}" font-size="15" fill="{{p.tcolor}}"><tspan font-weight="700">{{p.text}}</tspan><tspan font-weight="500" fill="#5F656D" dx="6">{{p.cap}}</tspan></text>
            </g>
          </sc-for>
        </svg>
      </div>
    </section>

    <section style="display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch">
      <div style="flex: 2 1 640px; min-width: 0; max-width: 100%; box-sizing: border-box; background: #FFFFFF; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 20px">
        <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em">Drives</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 32px 40px; align-items: start">
          <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
            <div style="display: flex; flex-direction: column; gap: 4px">
              <div style="display: grid; grid-template-columns: minmax(0, 1fr) 72px 44px; gap: 8px; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid #ECEAE6">
                <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -0.01em">{{g.day}}</span>
                <span style="text-align: right; font-size: 14px; font-weight: 600">{{g.miles}}</span>
                <span style="text-align: right; font-size: 14px; font-weight: 600">{{g.pct}}</span>
              </div>
              <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="5">
                <div style="display: grid; grid-template-columns: minmax(0, 1fr) 72px 44px; gap: 8px; align-items: center; min-height: 34px">
                  <span style="font-size: 15px; display: flex; align-items: center; gap: 6px"><span>{{r.from}}</span><span style="color: #8A9097">→</span><span>{{r.to}}</span></span>
                  <span style="text-align: right; font-size: 15px; color: #5F656D">{{r.miles}}</span>
                  <span style="text-align: right; font-size: 15px">{{r.pct}}</span>
                </div>
              </sc-for>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="flex: 1 1 320px; min-width: 0; max-width: 100%; box-sizing: border-box; background: #FFFFFF; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em">Chargers nearby</h2>
          <span style="font-size: 13px; color: #5F656D">from the Airbnb</span>
        </div>
        <div style="display: flex; flex-direction: column">
          <sc-for list="{{chargers}}" as="c" hint-placeholder-count="6">
            <div style="{{c.style}}">
              <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                <span style="font-size: 15px; font-weight: 600">{{c.name}}</span>
                <span style="font-size: 13px; color: #5F656D">{{c.sub}}</span>
              </div>
              <span style="font-size: 15px; font-weight: 600; text-align: right; white-space: nowrap">{{c.dist}}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1552}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { startStr: '90', effStr: '24', chargeOn: true };
  }

  renderVals() {
    const BAT = 69.5;
    const st = this.state;
    const on = st.chargeOn;
    let start = parseFloat(st.startStr);
    if (isNaN(start)) start = 90;
    start = Math.max(0, Math.min(100, start));
    let eff = parseFloat(st.effStr);
    if (isNaN(eff) || eff <= 0) eff = 24;
    const perMi = eff / BAT; // percent of battery per mile

    // day index, from, to, miles, start hour, end hour
    const L = (d, f, t, mi, s, h, charge) => ({ d: d, f: f, t: t, mi: mi, s: s, h: h, charge: !!charge });
    const legs = [
      L(0, 'Valencia', 'Sylmar', 13, 9.5, 9.85),
      L(0, 'Sylmar', 'Sugar and Scribe', 110, 9.95, 12.4),
      L(0, 'Sugar and Scribe', 'Sea Cliff', 8, 13.8, 14.0),
      L(0, 'Sea Cliff', 'Airbnb', 8, 15.7, 16.0),
      L(0, 'Airbnb', 'Zoya', 6, 18.7, 19.0),
      L(0, 'Zoya', 'Airbnb', 6, 20.5, 20.85),
      L(1, 'Airbnb', 'Fig Tree', 5, 8.7, 9.0),
      L(1, 'Fig Tree', 'Birch', 6, 10.0, 10.25),
      L(1, 'Birch', 'Harbor tour', 13, 15.2, 15.7),
      L(1, 'Harbor tour', 'Aladdin', 11, 17.6, 18.2),
      L(1, 'Aladdin', 'Airbnb', 3, 19.6, 19.75),
      L(2, 'Airbnb', 'Liberty Park', 2, 7.7, 7.85, true),
      L(2, 'Liberty Park', 'Shorehouse', 5, 8.55, 9.0),
      L(2, 'Shorehouse', 'Zoo', 12, 10.0, 10.5),
      L(2, 'Zoo', 'Balboa Park', 2, 14.9, 15.25),
      L(2, 'Balboa Park', 'Sultan', 18, 16.5, 17.5),
      L(2, 'Sultan', 'Airbnb', 15, 18.9, 19.5),
      L(3, 'Airbnb', 'Brunch', 7, 9.9, 10.25),
      L(3, 'Brunch', 'Sylmar', 125, 11.75, 14.25),
      L(3, 'Sylmar', 'Valencia', 13, 14.4, 14.7)
    ];

    // Walk the trip
    const pts = [];
    let lvl = start;
    const keys = {};
    let bolt = null;
    pts.push({ d: 0, h: 9.5, v: lvl });
    keys.start = { d: 0, h: 9.5, v: lvl };
    const dayEnd = {};
    legs.forEach((g) => {
      if (g.charge && !on) return;
      pts.push({ d: g.d, h: g.s, v: lvl });
      lvl = lvl - g.mi * perMi;
      pts.push({ d: g.d, h: g.h, v: lvl });
      dayEnd[g.d] = { d: g.d, h: g.h, v: lvl };
      if (g.charge) {
        const before = lvl;
        pts.push({ d: g.d, h: g.h + 0.25, v: before });
        pts.push({ d: g.d, h: g.h + 0.6, v: 80 });
        lvl = 80;
        keys.charged = { d: g.d, h: g.h + 0.6, v: 80 };
        bolt = { d: g.d, h: g.h + 0.425, v1: before, v2: 80 };
      }
    });
    keys.sat = dayEnd[0];
    keys.sun = dayEnd[1];
    keys.mon = dayEnd[2];
    keys.end = dayEnd[3];

    // Geometry
    const padL = 56, padR = 16, padT = 44, padB = 20, W = 1232, H = 400;
    const bandW = (W - padL - padR) / 4;
    let minV = 100;
    pts.forEach((p) => { if (p.v < minV) minV = p.v; });
    const lo = minV < 0 ? Math.floor(minV / 50) * 50 : 0;
    const hi = 100;
    const plotH = H - padT - padB;
    const Y = (v) => padT + (hi - v) / (hi - lo) * plotH;
    const X = (d, h) => padL + d * bandW + Math.max(0, Math.min(1, (h - 7) / 15)) * bandW;
    const f1 = (n) => Math.round(n * 10) / 10;

    let dStr = '';
    pts.forEach((p, i) => {
      const x = X(p.d, p.h), y = Y(p.v);
      if (i === 0) { dStr += 'M' + f1(x) + ' ' + f1(y); return; }
      const q = pts[i - 1];
      const x0 = X(q.d, q.h), y0 = Y(q.v);
      const mx = (x0 + x) / 2;
      dStr += ' C' + f1(mx) + ' ' + f1(y0) + ' ' + f1(mx) + ' ' + f1(y) + ' ' + f1(x) + ' ' + f1(y);
    });

    const fmt = (v, approx) => {
      const r = Math.round(v);
      return (approx && r >= 0 ? '~' : '') + (r < 0 ? '−' + Math.abs(r) : String(r)) + '%';
    };
    const LOW = '#C8432B', OKC = '#2FA67C', INK = '#1F2328';
    const dot = (k, opts) => {
      const p = keys[k];
      const x = X(p.d, p.h), y = Y(p.v);
      const low = p.v < 20;
      const o = Object.assign({ approx: true, cap: '', anchor: 'middle', dx: 0, dy: -16 }, opts || {});
      return {
        x: f1(x), y: f1(y), color: low ? LOW : OKC,
        lx: f1(x + o.dx), ly: f1(y + o.dy), anchor: o.anchor,
        text: fmt(p.v, o.approx), cap: o.cap, tcolor: low ? '#B93A24' : INK
      };
    };
    const dots = [
      dot('start', { approx: false, cap: 'start', anchor: 'start', dx: -6 }),
      dot('sat'), dot('sun')
    ];
    if (on) dots.push(dot('charged', { approx: false }));
    dots.push(dot('mon', { dy: 28 }));
    dots.push(dot('end', { cap: 'home', anchor: 'start', dx: 14, dy: 5 }));

    const bolts = [];
    if (bolt) {
      const bx = X(bolt.d, bolt.h) - 22;
      const by = Y((bolt.v1 + bolt.v2) / 2);
      bolts.push({ cx: f1(bx), cy: f1(by), t: 'translate(' + f1(bx - 6.6) + ' ' + f1(by - 6.6) + ') scale(0.55)' });
    }

    const grid = [];
    const ticks = lo < 0 ? [100, 50, 0, -50] : [100, 50, 0];
    ticks.forEach((t) => grid.push({ y: f1(Y(t)), ty: f1(Y(t) + 4), label: (t < 0 ? '\u2212' + Math.abs(t) : t) + '%' }));
    const dividers = [1, 2, 3].map((i) => ({ x: f1(padL + i * bandW) }));
    const days = ['Sat', 'Sun', 'Mon', 'Tue'].map((n, i) => ({ x: f1(padL + (i + 0.5) * bandW), label: n }));
    const y20 = Y(20);
    const gOff = (y20 - padT) / plotH;
    const chart = {
      d: dStr, grid: grid, dividers: dividers, days: days, dots: dots, bolts: bolts,
      y20: f1(y20), y20t: f1(y20 + 4),
      gTop: padT, gBottom: H - padB, gOff: f1(gOff * 1000) / 1000,
      negX: padL, negW: W - padL - padR,
      negY: f1(Y(0)), negH: lo < 0 ? f1(H - padB - Y(0)) : 0
    };

    // Drive list
    const names = ['Saturday', 'Sunday', 'Monday', 'Tuesday'];
    const groups = names.map((n, di) => {
      const ls = legs.filter((g) => g.d === di && !(g.charge && !on));
      const mi = ls.reduce((a, g) => a + g.mi, 0);
      return {
        day: n,
        miles: '~' + mi + ' mi',
        pct: Math.round(mi * perMi) + '%',
        rows: ls.map((g) => ({
          from: g.f, to: g.t,
          miles: '~' + g.mi + ' mi',
          pct: Math.max(1, Math.round(g.mi * perMi)) + '%'
        }))
      };
    });

    const row = (last) => 'display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0;' + (last ? '' : ' border-bottom: 1px solid #ECEAE6');
    const cdata = [
      ['Liberty Park Plaza', '4340 Genesee Ave · 8 stalls', '1.5 mi'],
      ['Independence Square', '7373 Clairemont Mesa Blvd', '~2 mi'],
      ['Kearny Office Park', '8344 Clairemont Mesa Blvd', '~3 mi'],
      ['Morena Blvd', '845 Morena Blvd', '~4 mi'],
      ['Villa La Jolla', '8657 Villa La Jolla Dr · in a mall', '5 mi'],
      ['Fashion Valley', '7007 Friars Rd · 48 stalls', '~6 mi']
    ];
    const chargers = cdata.map((c, i) => ({ name: c[0], sub: c[1], dist: c[2], style: row(i === cdata.length - 1) }));

    const base = 'font: inherit; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; height: 44px; box-sizing: border-box; padding: 0 18px; border: 0; border-radius: 999px; cursor: pointer; ';
    const chipStyle = on
      ? base + 'font-weight: 600; background: #1F2328; color: #FFFFFF'
      : base + 'font-weight: 500; background: #EFEDE9; color: #1F2328';

    const endV = keys.end.v;
    

    return {
      startStr: st.startStr,
      effStr: st.effStr,
      onStart: (e) => this.setState({ startStr: e.target.value }),
      onEff: (e) => this.setState({ effStr: e.target.value }),
      toggleCharge: () => this.setState({ chargeOn: !st.chargeOn }),
      chargeOn: on ? 'true' : 'false',
      chipStyle: chipStyle,
      chart: chart,
      groups: groups,
      chargers: chargers
    };
  }
}
</script>
</body>
</html>
