<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F6F3}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #EFEDE6; font-family: Figtree, system-ui, sans-serif; color: #1F2328; font-variant-numeric: tabular-nums">

  <div style="position: absolute; left: 0; top: 0; width: 1004px; height: 760px; transform-origin: 0 0; transform: translate(-135px, -190px) scale(0.9)">
    <svg width="1004" height="760" viewBox="0 0 1004 760" aria-hidden="true" style="display: block">
            <rect width="1004" height="760" fill="#D6E8F2"></rect>
            <path d="M372,0 C350,50 330,90 300,125 C270,155 235,170 215,195 C195,215 188,240 190,265 C192,300 178,340 188,395 C194,430 182,470 190,505 C200,550 225,600 235,650 C242,690 262,730 300,760 L1004,760 L1004,0 Z" fill="#EFEDE6" stroke="#E4E1D8" stroke-width="2"></path>
            <path d="M200,440 C215,410 260,405 295,420 C325,435 320,475 285,490 C250,500 215,490 205,470 Z" fill="#D6E8F2"></path>
            <path d="M345,600 C390,585 445,598 472,640 C497,678 515,722 524,760 L360,760 C350,700 340,650 345,600 Z" fill="#D6E8F2"></path>
            <path d="M520,560 C540,525 600,520 640,545 C665,570 650,610 610,622 C565,632 525,610 520,560 Z" fill="#DDEADB"></path>
            <path d="M250,95 C275,85 300,100 305,125 C285,140 255,135 248,115 Z" fill="#DDEADB"></path>
            <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
              <path d="M395,0 C380,80 340,150 330,200 S300,330 330,420 S400,520 450,600 S480,640 500,700 S520,740 530,760" stroke-width="8"></path>
              <path d="M610,0 C595,150 575,260 568,400 S548,520 548,520" stroke-width="6"></path>
              <path d="M200,525 C300,508 420,522 560,512 S800,492 1004,502" stroke-width="7"></path>
              <path d="M330,352 C450,342 560,336 1004,322" stroke-width="5"></path>
              <path d="M250,360 C300,375 340,420 330,420" stroke-width="4"></path>
            </g>
            <g font-family="Figtree, sans-serif" font-size="14" font-weight="600" fill="#68707A">
              <text x="372" y="40">Del Mar</text>
              <text x="282" y="250">La Jolla</text>
              <text x="204" y="398">Pacific Beach</text>
              <text x="478" y="448">Clairemont</text>
              <text x="582" y="508">Balboa Park</text>
              
              <text x="890" y="574">El Cajon</text>
              <text x="364" y="714" font-weight="500" fill="#3F6C86" font-style="italic">San Diego Bay</text>
              <text x="52" y="300" font-weight="500" fill="#3F6C86" font-style="italic" font-size="16">Pacific Ocean</text>
            </g>
          </svg>
    <svg width="1004" height="760" viewBox="0 0 1004 760" aria-hidden="true" style="position: absolute; left: 0; top: 0">
      <path d="{{returnD}}" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.7"></path>
      <path d="{{returnD}}" fill="none" stroke="#1F2328" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7" opacity="0.7"></path>
      <path d="{{routeD}}" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"></path>
      <path d="{{routeD}}" fill="none" stroke="#1F2328" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <sc-for list="{{chargers}}" as="c" hint-placeholder-count="2">
      <span role="img" aria-label="{{c.label}}" style="{{c.style}}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#24518F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"></path></svg>
      </span>
    </sc-for>
    <div style="position: absolute; left: 400px; top: 385px; transform: translate(-50%, -50%)">
      <span style="position: relative; width: 44px; height: 44px; border-radius: 999px; background: #1F2328; color: #FFFFFF; display: grid; place-items: center; border: 3px solid #FFFFFF; box-sizing: border-box; box-shadow: 0 3px 10px rgba(31,35,40,.3)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"></path><path d="M6 10v9h12v-9"></path><path d="M10 19v-5h4v5"></path></svg>
        <span style="position: absolute; right: -2px; top: -2px; width: 10px; height: 10px; border-radius: 999px; background: #FF7A59; border: 2px solid #FFFFFF"></span>
      </span>
    </div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="4">
      <span role="img" aria-label="{{p.label}}" style="{{p.style}}">{{p.num}}</span>
    </sc-for>
  </div>

  <div style="position: absolute; left: 16px; top: 16px; background: #FFFFFF; border-radius: 999px; padding: 10px 18px; box-shadow: 0 2px 8px rgba(31,35,40,.14); display: flex; align-items: center; gap: 10px">
    <svg width="22" height="22" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="12" r="6" fill="#FFB547"></circle><path d="M3 19c3-2 5-2 8 0s5 2 8 0 5-2 6-1" fill="none" stroke="#2C6E91" stroke-width="2.2" stroke-linecap="round"></path><path d="M3 24c3-2 5-2 8 0s5 2 8 0 5-2 6-1" fill="none" stroke="#2C6E91" stroke-width="2.2" stroke-linecap="round" opacity=".45"></path></svg>
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: -0.02em">Sunday, Nov 1</span>
  </div>

  <section style="position: absolute; left: 0; right: 0; bottom: 76px; height: 304px; box-sizing: border-box; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 20px 0; box-shadow: 0 -4px 20px rgba(31,35,40,.1); display: flex; flex-direction: column; gap: 10px">
    <span style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #DCD9D3"></span>
    <div style="display: flex; align-items: baseline">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em">Today’s stops</h1>
    </div>
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
        <div style="{{r.style}}">
          <sc-if value="{{r.isStop}}" hint-placeholder-val="{{ true }}">
            <span style="{{r.numStyle}}">{{r.num}}</span>
            <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
              <span style="font-weight: 600; font-size: 15px; line-height: 1.3">{{r.name}}</span>
              <span style="font-size: 13px; color: #5F656D">{{r.time}}</span>
            </div>
          </sc-if>
          <sc-if value="{{r.isDrive}}" hint-placeholder-val="{{ false }}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14v-5l-2-5H7l-2 5z"></path><circle cx="8" cy="17" r="1.6"></circle><circle cx="16" cy="17" r="1.6"></circle></svg>
            <span>{{r.drive}}</span>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </section>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #ECEAE6; padding: 6px 12px 14px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <a href="#" aria-current="{{t.current}}" style="{{t.style}}">
        <span style="{{t.iconStyle}}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="{{t.d1}}"></path>
            <path d="{{t.d2}}"></path>
          </svg>
        </span>
        <span>{{t.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const FILL = { act: '#D9F2EA', food: '#FFE3D3', booked: '#FFF0C2' };
    const stops = [
      { n: 'Fig Tree Cafe', t: '9:00 – 10:00a', k: 'food', p: [235, 365], d: '~12 min' },
      { n: 'Birch Aquarium', t: '10:15a – 1:45p', k: 'act', p: [218, 300], d: '~25 min', v: [[300, 335], [335, 430], [440, 590]] },
      { n: 'Flagship Harbor Tour', t: '4:15 – 5:15p', k: 'booked', p: [505, 650], d: '~20 min', v: [[540, 540], [566, 420]] },
      { n: 'Aladdin Cafe', t: '6:15 – 7:30p', k: 'food', p: [560, 330] }
    ];
    const AIR = [400, 385];
    const curve = (pts) => {
      let d = 'M' + pts[0][0].toFixed(1) + ',' + pts[0][1].toFixed(1);
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
        const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
        const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
        d += ' C' + c1[0].toFixed(1) + ',' + c1[1].toFixed(1) + ' ' + c2[0].toFixed(1) + ',' + c2[1].toFixed(1) + ' ' + p2[0].toFixed(1) + ',' + p2[1].toFixed(1);
      }
      return d;
    };
    const pts = [AIR];
    stops.forEach((st, i) => { pts.push(st.p); if (st.v && i < stops.length - 1) st.v.forEach((q) => pts.push(q)); });
    const routeD = curve(pts);
    const last = pts[pts.length - 1];
    const dx = AIR[0] - last[0], dy = AIR[1] - last[1], len = Math.hypot(dx, dy) || 1;
    const returnD = curve([last, [(last[0] + AIR[0]) / 2 - dy / len * 40, (last[1] + AIR[1]) / 2 + dx / len * 40], AIR]);
    const abs = (x, y) => 'position: absolute; left: ' + x + 'px; top: ' + y + 'px; transform: translate(-50%, -50%)';
    const pins = stops.map((st, i) => ({
      num: i + 1, label: (i + 1) + ', ' + st.n,
      style: abs(st.p[0], st.p[1]) + '; width: 34px; height: 34px; border-radius: 999px; box-sizing: border-box; border: 3px solid #FFFFFF; background: ' + FILL[st.k] + '; display: grid; place-items: center; font-size: 14px; font-weight: 700; box-shadow: 0 2px 8px rgba(31,35,40,.3)'
    }));
    const chargers = [{ n: 'Supercharger, Liberty Park Plaza', p: [362, 438] }, { n: 'Supercharger, Fashion Valley', p: [480, 500] }].map((c) => ({
      label: c.n, style: abs(c.p[0], c.p[1]) + '; width: 26px; height: 26px; border-radius: 999px; background: #DCEBFF; border: 2px solid #FFFFFF; box-sizing: border-box; display: grid; place-items: center; box-shadow: 0 1px 5px rgba(31,35,40,.25)'
    }));
    const rows = [];
    stops.forEach((st, i) => {
      rows.push({ isStop: true, isDrive: false, num: i + 1, name: st.n, time: st.t,
        style: 'display: flex; align-items: center; gap: 12px; padding: 4px 0',
        numStyle: 'flex: none; width: 30px; height: 30px; border-radius: 999px; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: ' + FILL[st.k] });
      if (st.d) rows.push({ isStop: false, isDrive: true, drive: st.d, style: 'display: flex; align-items: center; gap: 8px; padding: 1px 0 1px 8px; color: #5F656D; font-size: 13px' });
    });
    const T = [
      ['Today', 'M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4', 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z'],
      ['Schedule', 'M5 6h14a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z', 'M4 10h16M8 3v4M16 3v4'],
      ['Map', 'M12 21s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10z', 'M12 8.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z'],
      ['Places', 'M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z', '']
    ];
    const tabs = T.map(([label, d1, d2]) => {
      const on = label === 'Map';
      return { label, d1, d2, current: on ? 'page' : 'false',
        style: 'min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; font-size: 12px; font-weight: ' + (on ? 700 : 500) + '; color: ' + (on ? '#1F2328' : '#5F656D'),
        iconStyle: 'width: 48px; height: 28px; border-radius: 999px; display: grid; place-items: center; background: ' + (on ? '#1F2328' : 'transparent') + '; color: ' + (on ? '#FFFFFF' : '#5F656D') };
    });
    return { routeD, returnD, pins, chargers, rows, tabs };
  }
}
</script>
</body>
</html>
