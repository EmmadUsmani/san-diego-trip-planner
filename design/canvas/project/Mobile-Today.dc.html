<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile — Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F6F3}
a{color:#2C6E91}
button{font-family:Figtree,system-ui,sans-serif;cursor:pointer}
</style>
</helmet>
<div style="position: relative; height: 844px; overflow: hidden; font-family: Figtree, system-ui, sans-serif; color: #1F2328; font-variant-numeric: tabular-nums; background: #F7F6F3; width: 390px; box-sizing: border-box">
  <main style="padding: 24px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; height: 48px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; letter-spacing: -0.03em; font-size: 32px; line-height: 1">Sunday</span>
        <span style="font-size: 14px; color: #5F656D">11:10 am</span>
      </div>
      <span style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 999px; padding: 0 14px; height: 36px; font-weight: 700; font-size: 14px">
        <span style="width: 22px; height: 10px; border-radius: 3px; background: #EFEDE9; overflow: hidden; display: block"><span style="display: block; width: 34%; height: 100%; background: #2FA67C"></span></span>~34%
      </span>
    </div>

    <section style="background: #D9F2EA; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 15px; font-weight: 600; color: #1C6B50">Now</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; letter-spacing: -0.03em; font-size: 32px; line-height: 1.1">Birch Aquarium</span>
      <span style="font-size: 17px; color: #3E4A45">until 1:45</span>
      <a href="#" style="margin-top: 16px; align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 22px; box-sizing: border-box; border-radius: 999px; background: #1F2328; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l16-7-7 16-2-7z"></path></svg>Open in Maps</a>
    </section>

    <section style="background: #FFF0C2; border-radius: 24px; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 600; color: #8A6A00">Next</span>
        <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #5A4A1A"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14v-5l-2-5H7l-2 5z"></path><circle cx="8" cy="17" r="1.6"></circle><circle cx="16" cy="17" r="1.6"></circle></svg>24 min drive</span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; letter-spacing: -0.03em; font-size: 22px; letter-spacing: -0.02em">Harbor Tour 4:15</span>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A6A00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-label="Booked ticket" role="img"><path d="M4 8a2 2 0 0 0 2-2h12a2 2 0 0 0 2 2v8a2 2 0 0 0-2 2H6a2 2 0 0 0-2-2z"></path><path d="M10 6v12" stroke-dasharray="2 2"></path></svg>
    </section>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
      <div style="background: #ECE9FB; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; color: #4A3FB0">Next prayer · Dhuhr</span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; letter-spacing: -0.03em; font-size: 24px; letter-spacing: -0.02em; color: #4A3FB0">11:32</span>
      </div>
      <div style="background: #DCEBFF; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; color: #24518F">Rain 53% this pm</span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; letter-spacing: -0.03em; font-size: 24px; letter-spacing: -0.02em; color: #24518F">69°</span>
      </div>
    </div>

    <section style="background: #FFFFFF; border-radius: 24px; padding: 8px 24px; display: flex; flex-direction: column">
      <sc-for list="{{rest}}" as="r" hint-placeholder-count="3">
        <div style="{{r.style}}">
          <span style="width: 48px; font-size: 14px; color: #5F656D">{{r.time}}</span>
          <span style="{{r.nameStyle}}">{{r.name}}</span>
        </div>
      </sc-for>
    </section>
  </main>
  <div style="position: absolute; left: 0; right: 0; bottom: 0">
<nav aria-label="Main" style="display: flex; background: #FFFFFF; border-top: 1px solid #ECEAE6; padding: 8px 12px 20px; box-sizing: border-box">
  <a href="#" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #1F2328; font-size: 12px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"></path></svg><span>Today</span></a>
  <a href="#" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5F656D; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg><span>Schedule</span></a>
  <a href="#" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5F656D; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.3"></circle></svg><span>Map</span></a>
  <a href="#" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5F656D; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"></path></svg><span>Places</span></a>
</nav>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const row = 'display: flex; align-items: center; gap: 8px; height: 52px; border-top: 1px solid #ECEAE6';
    return {
      rest: [
        { time: '2:36', name: 'Asr', style: row.replace('border-top: 1px solid #ECEAE6', 'border-top: 0'), nameStyle: 'font-size: 14px; color: #6A62B8' },
        { time: '4:58', name: 'Maghrib', style: row, nameStyle: 'font-size: 15px; font-weight: 600; color: #4A3FB0' },
        { time: '6:15', name: 'Dinner at Aladdin Cafe', style: row, nameStyle: 'font-size: 16px; font-weight: 600' }
      ]
    };
  }
}
</script>
</body>
</html>
