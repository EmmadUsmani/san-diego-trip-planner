<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile — Schedule</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F6F3}
a{color:#2C6E91}
button{font-family:Figtree,system-ui,sans-serif;cursor:pointer}
</style>
</helmet>
<div style="min-height: 897px; display: flex; flex-direction: column; font-family: Figtree, system-ui, sans-serif; color: #1F2328; font-variant-numeric: tabular-nums; background: #F7F6F3; width: 390px; box-sizing: border-box">
  <main style="flex: 1; padding: 24px 20px 32px; display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; letter-spacing: -0.03em; font-size: 32px; line-height: 1">Schedule</h1>
    <div role="group" aria-label="Day" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="4">
        <button type="button" onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" style="{{d.style}}">
          <span style="font-size: 15px; font-weight: 700">{{d.name}}</span>
          <span style="font-size: 12px; opacity: .8">{{d.wx}}</span>
        </button>
      </sc-for>
    </div>
    <sc-if value="{{showNote}}" hint-placeholder-val="{{ true }}">
      <span style="font-size: 14px; color: #5F656D">Clocks fall back 1 hr at 2:00 am</span>
    </sc-if>
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div style="{{r.rowStyle}}">
          <span style="width: 44px; flex: none; font-size: 13px; color: #5F656D">{{r.time}}</span>
          <sc-if value="{{r.isBlock}}" hint-placeholder-val="{{ true }}">
            <div style="{{r.blockStyle}}">
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-weight: 600; font-size: 16px; line-height: 1.25">{{r.name}}</span>
                <span style="font-size: 13px; color: {{r.subColor}}">{{r.sub}}</span>
              </div>
              <sc-if value="{{r.booked}}" hint-placeholder-val="{{ false }}">
                <span style="display: flex; align-items: center; gap: 6px; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A6A00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-label="Booked ticket" role="img"><path d="M4 8a2 2 0 0 0 2-2h12a2 2 0 0 0 2 2v8a2 2 0 0 0-2 2H6a2 2 0 0 0-2-2z"></path><path d="M10 6v12" stroke-dasharray="2 2"></path></svg><button type="button" style="font: inherit; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #1F2328; border: 0; border-radius: 999px; height: 32px; padding: 0 12px">Skip</button></span>
              </sc-if>
              <sc-if value="{{r.locked}}" hint-placeholder-val="{{ false }}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-label="Locked" role="img" style="flex: none"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
              </sc-if>
              <sc-if value="{{r.movable}}" hint-placeholder-val="{{ true }}">
                <button type="button" aria-label="Reorder" style="flex: none; width: 36px; height: 44px; margin-right: -8px; border: 0; background: transparent; color: #5F656D; display: grid; place-items: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.7"></circle><circle cx="15" cy="6" r="1.7"></circle><circle cx="9" cy="12" r="1.7"></circle><circle cx="15" cy="12" r="1.7"></circle><circle cx="9" cy="18" r="1.7"></circle><circle cx="15" cy="18" r="1.7"></circle></svg></button>
              </sc-if>
            </div>
          </sc-if>
          <sc-if value="{{r.isDrive}}" hint-placeholder-val="{{ false }}">
            <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5F656D; padding-left: 4px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14v-5l-2-5H7l-2 5z"></path><circle cx="8" cy="17" r="1.6"></circle><circle cx="16" cy="17" r="1.6"></circle></svg><span>{{r.name}}</span></span>
          </sc-if>
          <sc-if value="{{r.isPrayer}}" hint-placeholder-val="{{ false }}">
            <div style="flex: 1; display: flex; align-items: center; gap: 10px">
              <span style="{{r.pill}}">{{r.name}}</span>
              <span style="{{r.line}}"></span>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </main>
<nav aria-label="Main" style="display: flex; background: #FFFFFF; border-top: 1px solid #ECEAE6; padding: 8px 12px 20px; box-sizing: border-box">
  <a href="#" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5F656D; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"></path></svg><span>Today</span></a>
  <a href="#" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #1F2328; font-size: 12px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg><span>Schedule</span></a>
  <a href="#" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5F656D; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.3"></circle></svg><span>Map</span></a>
  <a href="#" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5F656D; font-size: 12px; font-weight: 500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"></path></svg><span>Places</span></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":897}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { day: 'sun' }; }
  renderVals() {
    const D = [
      { id: 'sat', name: 'Sat', wx: '71° · 69%' },
      { id: 'sun', name: 'Sun', wx: '69° · 87%' },
      { id: 'mon', name: 'Mon', wx: '79° · 11%' },
      { id: 'tue', name: 'Tue', wx: '80° · 5%' }
    ];
    const A = (time, name, sub) => ({ k: 'act', time, name, sub });
    const F = (time, name, sub) => ({ k: 'food', time, name, sub });
    const B = (time, name, sub) => ({ k: 'book', time, name, sub });
    const X = (time, name, sub) => ({ k: 'fix', time, name, sub });
    const N = (time, name, sub) => ({ k: 'plain', time, name, sub });
    const V = (time, name) => ({ k: 'drive', time, name });
    const P = (time, name, strong) => ({ k: 'prayer', time, name, strong });
    const S = {
      sat: [P('5:57', 'Fajr', true), V('9:30', 'Valencia to Sylmar · 20 min'), V('9:55', 'To La Jolla · ~2h 30'), F('12:30', 'Sugar and Scribe', 'until 1:45'), P('12:32', 'Dhuhr', true), V('', '~15 min'), A('2:00', 'Sea Cliff Trail', 'until 3:30'), P('3:36', 'Asr', false), V('', '~25 min'), X('4:00', 'Check in', 'after 3:00'), P('5:58', 'Maghrib', true), V('', '~20 min'), F('7:00', 'Zoya', 'until 8:30'), P('7:08', 'Isha', false)],
      sun: [P('4:58', 'Fajr', true), F('9:00', 'Fig Tree Cafe', 'until 10:00'), V('', '~12 min'), A('10:15', 'Birch Aquarium', 'until 1:45'), P('11:32', 'Dhuhr', true), P('2:36', 'Asr', false), V('', '24 min'), B('4:15', 'Harbor Tour', 'until 5:15'), V('', '~22 min'), P('4:58', 'Maghrib', true), P('6:07', 'Isha', false), F('6:15', 'Aladdin Cafe', 'until 7:30')],
      mon: [P('4:58', 'Fajr', true), F('9:00', 'Shorehouse Kitchen', 'until 10:00'), V('', '~25 min'), A('10:30', 'San Diego Zoo', 'until 3:00'), P('11:32', 'Dhuhr', true), P('2:35', 'Asr', false), V('', '~10 min'), A('3:15', 'Balboa Park museum', 'until 4:30 · tentative'), V('', '~18 mi'), P('4:57', 'Maghrib', true), F('5:30', 'Sultan Baklava', 'until 7:00'), P('6:06', 'Isha', false)],
      tue: [P('4:59', 'Fajr', true), X('by 10', 'Check out', 'before 10:00'), V('', '~10 min'), F('10:15', 'Brunch', 'until 11:15'), P('11:32', 'Dhuhr', true), V('11:45', 'Drive home'), N('2:15', 'Drop Ömer', ''), P('2:34', 'Asr', false), V('', '~25 min'), N('2:40', 'Home', '')]
    };
    const fill = { act: ['#D9F2EA', '#3E4A45'], food: ['#FFE3D3', '#5C4033'], book: ['#FFF0C2', '#5A4A1A'], fix: ['#1F2328', '#C9CDD2'], plain: ['#EFEDE9', '#4A4F56'] };
    const day = this.state.day;
    const rows = S[day].map((e) => {
      const base = 'display: flex; align-items: center; gap: 8px; ';
      const o = { time: e.time, name: e.name, isBlock: false, isDrive: false, isPrayer: false, booked: false, locked: false, movable: false, sub: e.sub || '', subColor: '', blockStyle: '', pill: '', line: '' };
      if (e.k === 'drive') { o.isDrive = true; o.rowStyle = base + 'min-height: 32px'; }
      else if (e.k === 'prayer') {
        o.isPrayer = true; o.rowStyle = base + 'min-height: 36px';
        o.pill = e.strong ? 'font-size: 13px; font-weight: 600; background: #ECE9FB; color: #4A3FB0; padding: 4px 12px; border-radius: 999px' : 'font-size: 13px; color: #6A62B8; padding: 4px 0';
        o.line = e.strong ? 'flex: 1; border-top: 2px solid #7B6FDB' : 'flex: 1; border-top: 1px dashed rgba(123,111,219,.5)';
      } else {
        const f = fill[e.k];
        o.isBlock = true; o.rowStyle = base + 'min-height: 64px; padding: 4px 0'; o.subColor = f[1];
        o.blockStyle = 'flex: 1; min-width: 0; min-height: 64px; box-sizing: border-box; border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; gap: 8px; background: ' + f[0] + '; color: ' + (e.k === 'fix' ? '#FFFFFF' : '#1F2328');
        o.booked = e.k === 'book'; o.locked = e.k === 'fix'; o.movable = e.k !== 'fix' && e.k !== 'plain';
        if (!e.sub) o.sub = '';
      }
      return o;
    });
    return {
      showNote: day === 'sun',
      days: D.map((d) => {
        const on = d.id === day;
        return { name: d.name, wx: d.wx, pressed: on ? 'true' : 'false', pick: () => this.setState({ day: d.id }),
          style: 'font: inherit; border: 0; border-radius: 16px; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0 2px; ' + (on ? 'background: #1F2328; color: #FFFFFF' : 'background: #EFEDE9; color: #1F2328') };
      }),
      rows
    };
  }
}
</script>
</body>
</html>
