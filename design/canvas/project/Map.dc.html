<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F6F3}
a{color:#2C6E91}a:hover{color:#1F5370}
button{font-family:inherit}
</style>
</helmet>
<div style="min-height: 900px; background: #F7F6F3; font-family: Figtree, system-ui, sans-serif; color: #1F2328; font-variant-numeric: tabular-nums">

  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 40px; max-width: 1360px; margin: 0 auto; box-sizing: border-box">
    <a href="#" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1F2328">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="12" r="6" fill="#FFB547"></circle><path d="M3 19c3-2 5-2 8 0s5 2 8 0 5-2 6-1" fill="none" stroke="#2C6E91" stroke-width="2.2" stroke-linecap="round"></path><path d="M3 24c3-2 5-2 8 0s5 2 8 0 5-2 6-1" fill="none" stroke="#2C6E91" stroke-width="2.2" stroke-linecap="round" opacity=".45"></path></svg>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.02em">la jolla ’26</span>
    </a>
    <nav aria-label="Main" style="max-width: 100%; overflow-x: auto; box-sizing: border-box; display: flex; gap: 4px; background: #FFFFFF; border-radius: 999px; padding: 4px; box-shadow: 0 1px 2px rgba(31,35,40,.06)">
      <a href="#" style="padding: 8px 16px; border-radius: 999px; color: #1F2328; text-decoration: none; font-weight: 500; font-size: 14px">Overview</a>
      <a href="#" style="padding: 8px 16px; border-radius: 999px; color: #1F2328; text-decoration: none; font-weight: 500; font-size: 14px">Schedule</a>
      <a href="#" aria-current="page" style="padding: 8px 16px; border-radius: 999px; background: #1F2328; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 14px">Map</a>
      <a href="#" style="padding: 8px 16px; border-radius: 999px; color: #1F2328; text-decoration: none; font-weight: 500; font-size: 14px">Places</a>
      <a href="#" style="padding: 8px 16px; border-radius: 999px; color: #1F2328; text-decoration: none; font-weight: 500; font-size: 14px">Range</a>
    </nav>
    <div style="display: flex">
      <span title="Emmad" style="width: 32px; height: 32px; border-radius: 999px; background: #FFE3D3; color: #8A3A14; display: grid; place-items: center; font-weight: 700; font-size: 13px; border: 2px solid #F7F6F3">E</span>
      <span title="Ömer" style="width: 32px; height: 32px; border-radius: 999px; background: #D9F2EA; color: #1C6B50; display: grid; place-items: center; font-weight: 700; font-size: 13px; border: 2px solid #F7F6F3; margin-left: -8px">Ö</span>
    </div>
  </header>

  <main style="max-width: 1360px; margin: 0 auto; padding: 8px 40px 48px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch">

    <!-- left panel -->
    <section style="flex: 0 0 340px; max-width: 100%; height: 760px; box-sizing: border-box; background: #FFFFFF; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{dayChips}}" as="d" hint-placeholder-count="5">
          <button type="button" aria-pressed="{{d.pressed}}" onClick="{{d.pick}}" style="{{d.style}}">{{d.label}}</button>
        </sc-for>
      </div>
      <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em">{{dayTitle}}</h2>

      <div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
          <div style="{{r.style}}">
            <sc-if value="{{r.isStop}}" hint-placeholder-val="{{ true }}">
              <span style="{{r.numStyle}}">
                <sc-if value="{{r.isHouse}}" hint-placeholder-val="{{ false }}">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"></path><path d="M6 10v9h12v-9"></path></svg>
                </sc-if>
                <sc-if value="{{r.isNum}}" hint-placeholder-val="{{ true }}">{{r.num}}</sc-if>
              </span>
              <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
                <span style="font-weight: 600; font-size: 15px; line-height: 1.3">{{r.name}}</span>
                <span style="font-size: 13px; color: #5F656D">{{r.time}}</span>
              </div>
            </sc-if>
            <sc-if value="{{r.isDrive}}" hint-placeholder-val="{{ false }}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14v-5l-2-5H7l-2 5z"></path><circle cx="8" cy="17" r="1.6"></circle><circle cx="16" cy="17" r="1.6"></circle></svg>
              <span>{{r.drive}}</span>
            </sc-if>
          </div>
        </sc-for>
      </div>

      <div style="border-top: 1px solid #ECEAE6; padding-top: 16px; display: flex; flex-direction: column; gap: 12px">
        <span style="font-weight: 600; font-size: 15px">Show on map</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{layerChips}}" as="l" hint-placeholder-count="4">
            <button type="button" aria-pressed="{{l.pressed}}" onClick="{{l.toggle}}" style="{{l.style}}">{{l.label}}</button>
          </sc-for>
        </div>
      </div>
    </section>

    <!-- map card -->
    <section style="flex: 1 1 560px; min-width: 0; height: 760px; border-radius: 20px; overflow: auto; background: #D6E8F2">
      <div style="position: relative; width: 924px; height: 760px; overflow: hidden; background: #D6E8F2">
<div style="position: absolute; left: -40px; top: 0; width: 1004px; height: 760px">

        <div style="{{baseStyle}}">
          <svg width="1004" height="760" viewBox="0 0 1004 760" aria-hidden="true" style="display: block">
            <rect width="1004" height="760" fill="#D6E8F2"></rect>
            <path d="M372,0 C350,50 330,90 300,125 C270,155 235,170 215,195 C195,215 188,240 190,265 C192,300 178,340 188,395 C194,430 182,470 190,505 C200,550 225,600 235,650 C242,690 262,730 300,760 L1004,760 L1004,0 Z" fill="#EFEDE6" stroke="#E4E1D8" stroke-width="2"></path>
            <path d="M200,440 C215,410 260,405 295,420 C325,435 320,475 285,490 C250,500 215,490 205,470 Z" fill="#D6E8F2"></path>
            <path d="M345,600 C390,585 445,598 472,640 C497,678 515,722 524,760 L360,760 C350,700 340,650 345,600 Z" fill="#D6E8F2"></path>
            <path d="M520,560 C540,525 600,520 640,545 C665,570 650,610 610,622 C565,632 525,610 520,560 Z" fill="#DDEADB"></path>
            <path d="M250,95 C275,85 300,100 305,125 C285,140 255,135 248,115 Z" fill="#DDEADB"></path>
            <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
              <path d="M395,0 C380,80 340,150 330,200 S300,330 330,420 S400,520 450,600 S480,640 500,700 S520,740 530,760" stroke-width="8"></path>
              <path d="M610,0 C595,150 575,260 568,400 S548,520 548,520" stroke-width="6"></path>
              <path d="M200,525 C300,508 420,522 560,512 S800,492 1004,502" stroke-width="7"></path>
              <path d="M330,352 C450,342 560,336 1004,322" stroke-width="5"></path>
              <path d="M250,360 C300,375 340,420 330,420" stroke-width="4"></path>
            </g>
            <g font-family="Figtree, sans-serif" font-size="14" font-weight="600" fill="#68707A">
              <text x="372" y="40">Del Mar</text>
              <text x="282" y="250">La Jolla</text>
              <text x="204" y="398">Pacific Beach</text>
              <text x="478" y="448">Clairemont</text>
              <text x="582" y="508">Balboa Park</text>
              <text x="545" y="700">Downtown</text>
              <text x="890" y="574">El Cajon</text>
              <text x="364" y="714" font-weight="500" fill="#3F6C86" font-style="italic">San Diego Bay</text>
              <text x="52" y="300" font-weight="500" fill="#3F6C86" font-style="italic" font-size="16">Pacific Ocean</text>
            </g>
          </svg>
        </div>

        <!-- route + measure overlay -->
        <svg width="1004" height="760" viewBox="0 0 1004 760" aria-hidden="true" style="position: absolute; left: 0; top: 0; pointer-events: none">
          <sc-if value="{{showRoute}}" hint-placeholder-val="{{ true }}">
            <path d="{{routeD}}" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"></path>
            <path d="{{returnD}}" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.7"></path>
            <path d="{{returnD}}" fill="none" stroke="#1F2328" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7" opacity="0.7"></path>
            <path d="{{routeD}}" fill="none" stroke="#1F2328" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
          </sc-if>
          <sc-if value="{{measure}}" hint-placeholder-val="{{ true }}">
            <line x1="{{m.x1}}" y1="{{m.y1}}" x2="{{m.x2}}" y2="{{m.y2}}" stroke="#2C6E91" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"></line>
          </sc-if>
        </svg>

        <sc-if value="{{measure}}" hint-placeholder-val="{{ true }}">
          <div style="{{m.labelStyle}}">3.1 mi · 9 min</div>
        </sc-if>

        <!-- ideas, food, chargers -->
        <sc-for list="{{ideaPins}}" as="p" hint-placeholder-count="4">
          <button type="button" aria-label="{{p.label}}" onClick="{{p.open}}" style="{{p.style}}"></button>
        </sc-for>
        <sc-for list="{{chargerPins}}" as="p" hint-placeholder-count="3">
          <span role="img" aria-label="{{p.label}}" style="{{p.style}}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#24518F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"></path></svg>
          </span>
        </sc-for>

        <!-- airbnb -->
        <div style="{{airbnb.style}}">
          <span style="position: relative; width: 44px; height: 44px; border-radius: 999px; background: #1F2328; color: #FFFFFF; display: grid; place-items: center; border: 3px solid #FFFFFF; box-sizing: border-box; box-shadow: 0 3px 10px rgba(31,35,40,.3)">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"></path><path d="M6 10v9h12v-9"></path><path d="M10 19v-5h4v5"></path></svg>
            <span style="position: absolute; right: -2px; top: -2px; width: 10px; height: 10px; border-radius: 999px; background: #FF7A59; border: 2px solid #FFFFFF"></span>
          </span>
          <span style="background: #FFFFFF; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700; box-shadow: 0 1px 4px rgba(31,35,40,.18)">Airbnb</span>
        </div>

        <!-- trip stops -->
        <sc-for list="{{stopPins}}" as="p" hint-placeholder-count="4">
          <span role="img" aria-label="{{p.label}}" style="{{p.style}}">{{p.num}}</span>
        </sc-for>

        <!-- popover -->
        <sc-if value="{{pop.show}}" hint-placeholder-val="{{ true }}">
          <div role="dialog" aria-label="Place preview" style="{{pop.style}}">
            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px">
              <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; line-height: 1.25">{{pop.name}}</span>
              <button type="button" aria-label="Close" onClick="{{pop.close}}" style="flex: none; width: 24px; height: 24px; border: 0; background: #EFEDE9; border-radius: 999px; display: grid; place-items: center; cursor: pointer; color: #1F2328; padding: 0">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
              </button>
            </div>
            <span style="font-size: 13px; color: #5F656D">{{pop.meta}}</span>
            <div style="display: flex; gap: 8px">
              <button type="button" style="font: inherit; font-weight: 600; font-size: 14px; background: #1F2328; color: #FFFFFF; border: 0; border-radius: 999px; padding: 9px 16px; cursor: pointer">Add to day</button>
              <button type="button" style="font: inherit; font-weight: 600; font-size: 14px; background: #FFFFFF; color: #1F2328; border: 1px solid #DCD9D3; border-radius: 999px; padding: 8px 15px; cursor: pointer">Details</button>
            </div>
          </div>
        </sc-if>

        </div>
        <!-- controls -->
        <button type="button" aria-pressed="{{measure}}" onClick="{{toggleMeasure}}" style="{{measureBtnStyle}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17L17 3l4 4L7 21z"></path><path d="M8 12l2 2M11 9l2 2M14 6l2 2"></path></svg>
          Measure
        </button>
        <div style="position: absolute; right: 16px; top: 16px; width: 44px; background: #FFFFFF; border-radius: 14px; box-shadow: 0 2px 8px rgba(31,35,40,.14); display: flex; flex-direction: column; overflow: hidden">
          <button type="button" aria-label="Zoom in" onClick="{{zoomIn}}" style="height: 44px; border: 0; background: #FFFFFF; cursor: pointer; display: grid; place-items: center; color: #1F2328">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
          <div style="height: 1px; background: #ECEAE6"></div>
          <button type="button" aria-label="Zoom out" onClick="{{zoomOut}}" style="height: 44px; border: 0; background: #FFFFFF; cursor: pointer; display: grid; place-items: center; color: #1F2328">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
          </button>
        </div>
        <span style="position: absolute; left: 16px; bottom: 14px; font-size: 12px; color: #4A4F56; background: rgba(255,255,255,.85); padding: 4px 10px; border-radius: 999px">Illustration only. The real app uses OpenStreetMap.</span>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { day: 'sun', layers: { plan: true, ideas: true, food: false, chargers: true }, measure: true, zoom: 1, pop: 'rose' };
  }
  renderVals() {
    const s = this.state;
    const AIR = [400, 385];
    const C = [502, 380];
    const z = s.zoom;
    const P = (x, y) => [C[0] + (x - C[0]) * z, C[1] + (y - C[1]) * z];
    const DAYS = [['all', 'All'], ['sat', 'Sat'], ['sun', 'Sun'], ['mon', 'Mon'], ['tue', 'Tue']];
    const TITLES = { all: 'Whole trip', sat: 'Saturday, Oct 31', sun: 'Sunday, Nov 1', mon: 'Monday, Nov 2', tue: 'Tuesday, Nov 3' };
    const STOPS = {
      sat: [
        { n: 'Sugar and Scribe', t: '12:30 – 1:45p', k: 'food', p: [262, 216], d: '~15 min' },
        { n: 'Sea Cliff Coastal Bluff Trail', t: '2:00 – 3:30p', k: 'act', p: [355, 80], d: '~25 min', v: [[345, 160], [345, 290], [375, 370]] },
        { n: 'Check in', t: '4:00p', k: 'home', p: AIR, d: '~15 min', v: [[300, 335]] },
        { n: 'Zoya', t: '7:00 – 8:30p', k: 'food', p: [222, 238] }
      ],
      sun: [
        { n: 'Fig Tree Cafe', t: '9:00 – 10:00a', k: 'food', p: [235, 365], d: '~12 min' },
        { n: 'Birch Aquarium', t: '10:15a – 1:45p', k: 'act', p: [218, 300], d: '~25 min', v: [[300, 335], [335, 430], [440, 590]] },
        { n: 'Flagship Harbor Tour', t: '4:15 – 5:15p', k: 'booked', p: [505, 650], d: '~20 min', v: [[540, 540], [566, 420]] },
        { n: 'Aladdin Cafe', t: '6:15 – 7:30p', k: 'food', p: [560, 330] }
      ],
      mon: [
        { n: 'Shorehouse Kitchen', t: '9:00 – 10:00a', k: 'food', p: [200, 268], d: '~25 min', v: [[300, 335], [335, 430], [450, 595]] },
        { n: 'San Diego Zoo', t: '10:30a – 3:00p', k: 'act', p: [612, 592], d: '~5 min' },
        { n: 'Balboa Park museum', t: '3:15 – 4:30p', k: 'act', p: [553, 546], d: '~25 min', v: [[720, 515]] },
        { n: 'Sultan Baklava', t: '5:30 – 7:00p', k: 'food', p: [930, 520] }
      ],
      tue: [
        { n: 'Check out', t: 'Before 10:00a', k: 'home', p: AIR }
      ]
    };
    const all = s.day === 'all';
    const dayKeys = all ? ['sat', 'sun', 'mon', 'tue'] : [s.day];
    const list = [];
    dayKeys.forEach((dk) => STOPS[dk].forEach((st, i, arr) => list.push(Object.assign({ day: dk, last: i === arr.length - 1 }, st))));
    const FILL = { act: '#D9F2EA', food: '#FFE3D3', booked: '#FFF0C2' };
    let num = 0;
    list.forEach((st) => { if (st.k !== 'home') { num += 1; st.num = num; } });

    const rows = [];
    const dayName = { sat: 'Sat', sun: 'Sun', mon: 'Mon', tue: 'Tue' };
    list.forEach((st) => {
      const home = st.k === 'home';
      rows.push({
        isStop: true, isDrive: false, isHouse: home, isNum: !home, num: st.num, name: st.n,
        time: (all ? dayName[st.day] + ' · ' : '') + st.t,
        style: 'display: flex; align-items: center; gap: 12px; padding: ' + (all ? '2px' : '6px') + ' 0',
        numStyle: 'flex: none; width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: ' + (home ? '#FFFFFF' : '#1F2328') + '; background: ' + (home ? '#1F2328' : FILL[st.k])
      });
      if (!st.last && !all) {
        rows.push({ isStop: false, isDrive: true, drive: st.d, style: 'display: flex; align-items: center; gap: 8px; padding: 2px 0 2px 8px; color: #5F656D; font-size: 13px' });
      }
    });

    const dayChips = DAYS.map(([id, label]) => ({
      label, pressed: s.day === id ? 'true' : 'false',
      pick: () => this.setState({ day: id }),
      style: 'font: inherit; font-size: 13px; font-weight: ' + (s.day === id ? 600 : 500) + '; border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer; background: ' + (s.day === id ? '#1F2328' : '#EFEDE9') + '; color: ' + (s.day === id ? '#FFFFFF' : '#1F2328')
    }));
    const LAY = [['plan', 'Plan'], ['ideas', 'Ideas'], ['food', 'Food'], ['chargers', 'Chargers']];
    const layerChips = LAY.map(([id, label]) => {
      const on = s.layers[id];
      return {
        label, pressed: on ? 'true' : 'false',
        toggle: () => this.setState({ layers: Object.assign({}, s.layers, { [id]: !on }) }),
        style: 'font: inherit; font-size: 13px; font-weight: ' + (on ? 600 : 500) + '; border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer; background: ' + (on ? '#1F2328' : '#EFEDE9') + '; color: ' + (on ? '#FFFFFF' : '#1F2328')
      };
    });

    const abs = (x, y) => 'position: absolute; left: ' + x.toFixed(1) + 'px; top: ' + y.toFixed(1) + 'px; transform: translate(-50%, -50%)';
    const stopPins = s.layers.plan ? list.filter((st) => st.k !== 'home').map((st) => {
      const [x, y] = P(st.p[0], st.p[1]);
      return { num: st.num, label: st.num + ', ' + st.n, style: abs(x, y) + '; width: 32px; height: 32px; border-radius: 999px; box-sizing: border-box; border: 3px solid #FFFFFF; background: ' + FILL[st.k] + '; color: #1F2328; display: grid; place-items: center; font-size: 13px; font-weight: 700; box-shadow: 0 2px 8px rgba(31,35,40,.3); z-index: 3' };
    }) : [];

    const routeStops = list;
    const curve = (pts) => {
      let d = 'M' + pts[0][0].toFixed(1) + ',' + pts[0][1].toFixed(1);
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
        const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
        const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
        d += ' C' + c1[0].toFixed(1) + ',' + c1[1].toFixed(1) + ' ' + c2[0].toFixed(1) + ',' + c2[1].toFixed(1) + ' ' + p2[0].toFixed(1) + ',' + p2[1].toFixed(1);
      }
      return d;
    };
    let routeD = '', returnD = '';
    const showRoute = s.layers.plan && !all && routeStops.length > 1;
    if (showRoute) {
      const pts = [P(AIR[0], AIR[1])];
      routeStops.forEach((st, i) => { pts.push(P(st.p[0], st.p[1])); if (st.v && i < routeStops.length - 1) st.v.forEach((q) => pts.push(P(q[0], q[1]))); });
      routeD = curve(pts);
      const last = pts[pts.length - 1], home = P(AIR[0], AIR[1]);
      const dx = home[0] - last[0], dy = home[1] - last[1], len = Math.hypot(dx, dy) || 1;
      const mid = [(last[0] + home[0]) / 2 - dy / len * 40, (last[1] + home[1]) / 2 + dx / len * 40];
      returnD = curve([last, mid, home]);
    }

    const IDEAS = [
      { id: 'rose', n: 'Rose Canyon Open Space Park', p: [335, 305], k: 'act', meta: '~4 mi · 8 min from Airbnb' },
      { id: 'coast', n: 'Coast Walk Trail', p: [212, 200], k: 'act', meta: '~6 mi · 14 min from Airbnb' },
      { id: 'geisel', n: 'UCSD Geisel Library', p: [285, 268], k: 'act', meta: '~5 mi · 12 min from Airbnb' },
      { id: 'italy', n: 'Little Italy', p: [525, 612], k: 'act', meta: '~8 mi · 16 min from Airbnb' },
      { id: 'akhi', n: "Akhi's Shawarma & Kebab", p: [270, 340], k: 'food', meta: '~3 mi · 9 min from Airbnb' },
      { id: 'skillet', n: 'Urban Skillet', p: [362, 168], k: 'food', meta: '~8 mi · 15 min from Airbnb' },
      { id: 'khyber', n: 'Khyber Pass Zarparan', p: [440, 470], k: 'food', meta: '~4 mi · 11 min from Airbnb' }
    ];
    const vis = IDEAS.filter((i) => (i.k === 'act' ? s.layers.ideas : s.layers.food));
    const ideaPins = vis.map((i) => {
      const [x, y] = P(i.p[0], i.p[1]);
      const on = s.pop === i.id;
      const col = i.k === 'act' ? '#1C6B50' : '#C2562B';
      return {
        label: i.n, open: () => this.setState({ pop: on ? null : i.id }),
        style: abs(x, y) + '; width: 16px; height: 16px; border-radius: 999px; box-sizing: border-box; background: #FFFFFF; border: 3px solid ' + col + '; padding: 0; cursor: pointer; z-index: 2' + (on ? '; box-shadow: 0 0 0 5px rgba(31,35,40,.12)' : '')
      };
    });
    const sel = vis.find((i) => i.id === s.pop);
    let pop = { show: false, style: '', name: '', meta: '', close: () => this.setState({ pop: null }) };
    if (sel) {
      const [x, y] = P(sel.p[0], sel.p[1]);
      pop = { show: true, name: sel.n, meta: sel.meta, close: () => this.setState({ pop: null }),
        style: 'position: absolute; left: ' + (x + 16).toFixed(1) + 'px; bottom: ' + (760 - y + 12).toFixed(1) + 'px; width: 264px; box-sizing: border-box; background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 8px 28px rgba(31,35,40,.18); z-index: 6' };
    }

    const CH = [
      { n: 'Supercharger, Liberty Park Plaza', p: [362, 438] },
      { n: 'Supercharger, Villa La Jolla', p: [308, 212] },
      { n: 'Supercharger, Fashion Valley', p: [480, 500] },
      { n: 'Supercharger, Morena Blvd', p: [395, 548] },
      { n: 'Supercharger, Kearny Office Park', p: [655, 332] }
    ];
    const chargerPins = s.layers.chargers ? CH.map((c) => {
      const [x, y] = P(c.p[0], c.p[1]);
      return { label: c.n, style: abs(x, y) + '; width: 26px; height: 26px; border-radius: 999px; background: #DCEBFF; border: 2px solid #FFFFFF; box-sizing: border-box; display: grid; place-items: center; box-shadow: 0 1px 5px rgba(31,35,40,.25); z-index: 2' };
    }) : [];

    const [ax, ay] = P(AIR[0], AIR[1]);
    const a2 = P(560, 330);
    const mx = (ax + a2[0]) / 2, my = (ay + a2[1]) / 2;
    const m = { x1: ax, y1: ay, x2: a2[0], y2: a2[1],
      labelStyle: abs(mx, my) + '; background: #2C6E91; color: #FFFFFF; font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px; white-space: nowrap; box-shadow: 0 2px 8px rgba(31,35,40,.2); z-index: 4' };

    return {
      dayChips, dayTitle: TITLES[s.day], rows, layerChips, stopPins, routeD, returnD, showRoute, ideaPins, chargerPins, pop, m,
      measure: s.measure,
      airbnb: { style: abs(ax, ay) + '; display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 10px; z-index: 5' },
      baseStyle: 'width: 1004px; height: 760px; transform-origin: 502px 380px; transform: scale(' + z + ')',
      toggleMeasure: () => this.setState({ measure: !s.measure }),
      measureBtnStyle: 'position: absolute; left: 16px; top: 16px; height: 44px; display: flex; align-items: center; gap: 8px; border-radius: 999px; padding: 0 18px; font-size: 14px; font-weight: 600; cursor: pointer; border: 0; box-shadow: 0 2px 8px rgba(31,35,40,.14); background: ' + (s.measure ? '#1F2328' : '#FFFFFF') + '; color: ' + (s.measure ? '#FFFFFF' : '#1F2328'),
      zoomIn: () => this.setState({ zoom: Math.min(1.6, +(s.zoom + 0.2).toFixed(1)) }),
      zoomOut: () => this.setState({ zoom: Math.max(1, +(s.zoom - 0.2).toFixed(1)) })
    };
  }
}
</script>
